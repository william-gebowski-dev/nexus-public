name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate mock contracts
        run: npm run check:mocks

      - name: Validate AI contracts
        run: npm run check:ai-contracts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (informational)
        # Não falha o CI — vulnerabilidades são listadas para triagem.
        # `npm audit fix --force` é desencorajado; atualizações seguras
        # são feitas em commits separados após análise.
        run: npm audit --json || true
