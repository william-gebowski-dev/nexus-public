<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0b0f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self';"
    />
    <title>Nexus — Painel operacional vivo</title>
    <meta
      name="description"
      content="Painel operacional vivo do ecossistema Nexus — saúde, agentes, projetos, roadmap e atividades em arquitetura local."
    />
    <script>
      // Tema inicial síncrono para evitar flash (FOUC).
      try {
        var m = localStorage.getItem("nexus-theme");
        if (m && m !== "auto") {
          document.documentElement.setAttribute("data-theme", m);
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg text-text font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
